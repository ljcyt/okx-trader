[project]
name = "okx-trader"
version = "0.2.0"
description = "Multi-agent committee trading agent for OKX demo trading, with a web dashboard"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "bottle>=0.13",
    "python-okx>=0.4.3,<0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["okx_trader", "okx_trader.store", "okx_trader.web", "okx_trader.alerts"]

[project.scripts]
okxt = "okx_trader.cli:main"
